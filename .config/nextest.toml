# cargo-nextest profiles (docs/testing.md).

[profile.default]
slow-timeout = { period = "10s" }

# CI: run every test, never retry, write a JUnit report for the workflow.
[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"

# The sandbox autotests build real file trees and walk them: one at a time, so a slow disk never starves a scan.
[test-groups]
sandboxes = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(sandboxes)'
test-group = 'sandboxes'
