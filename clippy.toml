allow-expect-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false

# Scanning is read-only: only fresher-cleaner deletes, at its single deletion point
# (`crates/cleaner/src/remove/permanent.rs`), under `#[expect(clippy::disallowed_methods, reason = "...")]`
# (docs/restrictions/deletion-safety.md); `crates/cleaner/tests/deletion_point.rs` checks it is the only one. Besides
# `std::fs`'s, the one deleting function is `fresher-macos`'s `remove_at` (an entry of a held folder, `unlinkat`).
disallowed-methods = [
  { path = "fresher_macos::beneath::remove_at", reason = "only the deletion point deletes: crates/cleaner/src/remove/permanent.rs (docs/architecture/removal.md)" },
  { path = "std::fs::remove_file", reason = "only the deletion point deletes: crates/cleaner/src/remove/permanent.rs (docs/architecture/removal.md)" },
  { path = "std::fs::remove_dir", reason = "only the deletion point deletes: crates/cleaner/src/remove/permanent.rs (docs/architecture/removal.md)" },
  { path = "std::fs::remove_dir_all", reason = "only the deletion point deletes: crates/cleaner/src/remove/permanent.rs (docs/architecture/removal.md)" },
  { path = "std::env::home_dir", reason = "the home folder is looked up once, in the app's setup; everything else gets its roots injected" },
  { path = "tauri::path::PathResolver::home_dir", reason = "the home folder is looked up once, in the app's setup; everything else gets its roots injected" },
]
