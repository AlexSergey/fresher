[package]
name = "fresher-macos"
description = "The macOS adapters of Fresher: the only crate with unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Test helpers that write (an APFS clone of a file), for the tests of other crates; never in the app.
fixtures = []

[dependencies]
fresher-core = { path = "../core" }
libc.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
