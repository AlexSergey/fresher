# A release from a pushed version tag (docs/workflow.md, "Releases"; plan 013/04): the universal app in a disk image,
# its checksums and its build provenance, attached to a draft release that a person publishes. Run by hand, it is a
# dry run of the same build: the files are kept as an artifact and no release is made.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HUSKY: 0

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
      # No caches: a release is built only from the tagged tree and the locked downloads.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Read the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            version="${TAG#v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # CI has run every check on main's commits, so a release is cut from main only.
      - name: Check that the tag is on main
        if: ${{ github.event_name == 'push' }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Every place holds the version, and the changelog and the release notes have its section and file.
      - name: Check the version, the changelog and the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-version.ts check "$VERSION"
      - run: npm run test:scripts
      # The universal app and its disk image, then the bundle check on both (scripts/check-bundle.ts --release).
      - run: npm run build:release
      # The release's body: docs/releases/<v>.md, then the version's section of docs/changelog.md.
      - name: Gather the release files and their checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp "target/universal-apple-darwin/release/bundle/dmg/Fresher_${VERSION}_universal.dmg" release/
          node scripts/release-version.ts notes "$VERSION" > release/notes.md
          cd release
          shasum -a 256 "Fresher_${VERSION}_universal.dmg" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The draft release and its files.
      contents: write
      # The build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the files against their checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Fresher_*_universal.dmg
      # A draft: a person checks it against the release checklist and publishes it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "Fresher $VERSION"
          --notes-file release/notes.md
          "release/Fresher_${VERSION}_universal.dmg"
          release/SHA256SUMS
