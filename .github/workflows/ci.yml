# The same checks as the git hooks, plus the e2e suites, the audits and a build of the app bundle (docs/quality.md,
# "Layer 5").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HUSKY: 0
  # .config/nextest.toml: every test runs, none retried, a JUnit report written.
  NEXTEST_PROFILE: ci

jobs:
  lint:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-about@0.9.3,cargo-deny@0.20.2,cargo-machete@0.9.2,typos@1.51.1
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color
      - run: npm run lint
      - run: npm run check:readme
      # The licence notices are read offline from the local registry (`cargo about --frozen`), so the crates are fetched
      # first.
      - run: cargo fetch --locked
      - run: npm run check:notices
      - run: npm run check:crate-deps
      - run: npm run knip
      - run: npm run check:machete
      - run: npm run check:deny
      - run: npm run check:typos
      - run: npm audit --omit=dev --audit-level=high

  test:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1
      - run: npm run test:scripts
      - run: npm run test:cov
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            target/**/nextest/ci/junit.xml
          retention-days: 14

  e2e:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.149
      - name: Install the Playwright browsers
        run: npm exec --workspace app/ui -- playwright install webkit chromium
      # Full keyboard access, as on a developer's Mac: without it WebKit's Tab skips buttons.
      - name: Turn on full keyboard access
        run: defaults write -g AppleKeyboardUIMode -int 3
      # The screenshots are compared on the developer's Mac only (pre-push, docs/testing.md): the runner's macOS draws
      # text a few pixels differently from the one the baselines were taken on.
      - run: npm run test:e2e:core
      - run: npm run test:e2e --workspace app/ui -- --ignore-snapshots
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: e2e
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # An unsigned bundle: signing and notarization belong to the release plan.
      - run: npm run build
