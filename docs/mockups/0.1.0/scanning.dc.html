<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scanning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#a3a9b4;font-size:13px;text-decoration:none}
.nav:hover{background:#1f232a;color:#eceef2}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:linear-gradient(180deg,#1a1d23,#15171b);border:1px solid #262b33}
</style>
</helmet>
<div style="width: 1100px; height: 780px; display: flex; background: #0e0f12; color: #eceef2; font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif; overflow: hidden">

  <nav aria-label="Main" style="width: 200px; flex: none; background: linear-gradient(180deg, #08090b, #0e0f12); border-right: 1px solid #1f232a; padding: 44px 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 600; padding: 0 10px 18px">
      <svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="s-body" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#2a2f38"></stop><stop offset="1" stop-color="#0e0f12"></stop></linearGradient>
          <linearGradient id="s-band" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4553dc"></stop><stop offset="1" stop-color="#9aa6ff"></stop></linearGradient>
          <clipPath id="s-clip"><path d="M8 92 C8 46 32 10 72 8 L88 8 Q92 8 92 12 L92 54 C92 80 70 92 44 92 Z"></path></clipPath>
        </defs>
        <path d="M8 92 C8 46 32 10 72 8 L88 8 Q92 8 92 12 L92 54 C92 80 70 92 44 92 Z" fill="url(#s-body)"></path>
        <g clip-path="url(#s-clip)"><path d="M6 96 C28 60 56 44 96 34 L96 48 C64 56 40 70 20 96 Z" fill="url(#s-band)"></path></g>
        <path d="M8 92 C8 46 32 10 72 8 L88 8 Q92 8 92 12 L92 54 C92 80 70 92 44 92 Z" fill="none" stroke="url(#s-band)" stroke-opacity="0.5" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="M34 17 C35 28 37 30 48 31 C37 32 35 34 34 45 C33 34 31 32 20 31 C31 30 33 28 34 17 Z" fill="#eceef2"></path>
      </svg>
      Fresher
    </div>
    <a class="nav" href="#" style="background: #1f232a; color: #eceef2">Scan</a>
    <a class="nav" href="#">Apps</a>
    <div style="height: 14px"></div>
    <a class="nav" href="Review.dc.html">Review</a>
    <a class="nav" href="#">Cleanups</a>
    <div style="flex-grow: 1"></div>
    <a class="nav" href="Settings.dc.html">Settings</a>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 20px 36px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 600">Scan</span>
      <button style="font: inherit; font-size: 13px; color: #eceef2; background: #1f232a; border: 1px solid #313741; border-radius: 7px; padding: 5px 12px">Stop</button>
    </div>

    <section aria-label="Scanning" style="position: relative; height: 226px; border-radius: 18px; border: 1px solid #262b33; background: radial-gradient(120% 140% at 20% 0%, #1d2140 0%, #15171b 55%); overflow: hidden">
      <svg width="830" height="226" viewBox="0 0 830 226" role="img" aria-label="Scanning, 62 percent" style="position: absolute; inset: 0">
        <defs>
          <linearGradient id="p-band" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4553dc"></stop><stop offset="1" stop-color="#9aa6ff"></stop></linearGradient>
          <filter id="p-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
        </defs>
        <path d="M30 200 C220 110 480 70 800 50" fill="none" stroke="#262b33" stroke-width="14" stroke-linecap="round"></path>
        <path d="M30 200 C220 110 480 70 800 50" fill="none" stroke="url(#p-band)" stroke-width="14" stroke-linecap="round" stroke-dasharray="520 1000" filter="url(#p-glow)" opacity="0.6"></path>
        <path d="M30 200 C220 110 480 70 800 50" fill="none" stroke="url(#p-band)" stroke-width="14" stroke-linecap="round" stroke-dasharray="520 1000"></path>
        <path d="M528 72 C529 81 531 83 540 84 C531 85 529 87 528 96 C527 87 525 85 516 84 C525 83 527 81 528 72 Z" fill="#eceef2"></path>
      </svg>
      <div style="position: absolute; left: 28px; top: 22px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #a3a9b4">Scanning Macintosh HD</span>
        <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.5px">62%</span>
        <span style="font-size: 13px; color: #c9ced6">Looking at developer caches</span>
      </div>
      <div style="position: absolute; right: 28px; bottom: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-size: 22px; font-weight: 700; color: #3dd68c">1.9 GB</span>
        <span style="font-size: 12px; color: #a3a9b4">found so far</span>
      </div>
    </section>

    <div role="separator" style="display: flex; align-items: center; gap: 14px; padding-top: 4px">
      <span style="font-size: 12px; font-weight: 600; color: #a3a9b4; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap">What you can remove</span>
      <span style="flex: 1; height: 1px; background: linear-gradient(90deg, #313741, rgba(49,55,65,0))"></span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div class="tile" style="border-color: #2b4a3b">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(61,214,140,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3dd68c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 600">App caches</span>
            <span style="font-size: 12px; color: #8a919c">Copies apps keep to open things faster</span>
          </div>
        </div>
        <span style="font-size: 24px; font-weight: 700">1.4 GB</span>
      </div>
      <div class="tile" style="border-color: #2b4a3b">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(61,214,140,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3dd68c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6z"></path><path d="M11 7L4 14l3 3 7-7"></path><path d="M4 20h7"></path></svg></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 600">Xcode build data</span>
            <span style="font-size: 12px; color: #8a919c">Leftovers of past app builds</span>
          </div>
        </div>
        <span style="font-size: 24px; font-weight: 700">480 MB</span>
      </div>
      <div class="tile" style="opacity: 0.45">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: #262b33"></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="width: 140px; height: 12px; border-radius: 6px; background: #262b33"></span>
            <span style="width: 200px; height: 10px; border-radius: 5px; background: #1f232a"></span>
          </div>
        </div>
        <span style="width: 90px; height: 20px; border-radius: 6px; background: #262b33"></span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":780}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
