# A demo world: a believable developer's Mac for the demo recordings (plan 038). Nothing in it is checked but `shows`:
# the category ids the scan of the whole app must offer (`app/tauri/tests/demos.rs` scans it with every module and fails
# naming a category that offers nothing). Every case is scenery. The files are sparse and `sizes = "as-declared"` states
# each one's declared size as the space it takes, so the app shows tens of gigabytes that cost no disk; `[demo.volume]`
# states the disk, whose used space exceeds the world's total by about 300 GB (the rest of the Mac), with macOS's own
# system volume beside it and a few gigabytes of the disk's own space. Every name is made up: no real person, company or
# product; the apps' bundle ids are under `com.example.` or are those of the tools the app cleans.
#
# Left out on purpose: the `xcode`, `docker`, `trash`, `jetbrains` and Ollama stories (their shapes need an external
# program's answer, a Trash the sandbox keeps apart, or multi-file stores whose sizes must agree, which a sparse world
# does not model); the `stale-projects` other kinds of build output; and a permission notice: access is stated granted
# for every guarded folder the modules read and `[settings]` turns their switches on, as a user who allowed them has,
# so the scan reads them all; no file is under a folder only Full Disk Access opens (Pictures, Movies, Music), which a
# sandbox cannot state, so no size reads as partial.
feature = "developer-mac"

[settings]
"core.access.desktop" = true
"core.access.documents" = true
"core.access.downloads" = true
"unused-toolchains.node-versions" = true

[demo]
now = 1795000000
sizes = "as-declared"
shows = [
  "dev-caches.xcode-derived-data",
  "dev-caches.npm",
  "dev-caches.homebrew",
  "dev-caches.cargo",
  "dev-caches.gradle",
  "app-caches.library-caches",
  "app-caches.browsers",
  "app-leftovers.caches",
  "app-leftovers.settings",
  "app-leftovers.data",
  "local-ai-models.lm-studio",
  "unused-toolchains.rust",
  "unused-toolchains.node",
  "downloads.installers",
  "downloads.unfinished",
  "downloads.large-untouched",
  "downloads.macos-installers",
  "logs.app-logs",
  "logs.crash-reports",
  "stale-projects.dependencies",
  "temp.old-files",
]

