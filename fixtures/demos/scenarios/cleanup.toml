# A cleanup, from the scan to the space it freed: scan, tick the largest Safe category, review it (its tile, ticked
# whole), press Review's "Move to the Trash", confirm the confirmation's "Yes, move to the Trash" (never the permanent
# choice), and rest on the result that says how much was freed. Screens: Scan, Review, the confirm dialog, the
# cleanup's result. The world starts with the agreement accepted (`agreement = "accepted"` in its `[demo]`), so no
# sheet comes between; the user's wish (2026-11-25): skip the sheet and end on the result. About 7 s of pauses.
world = "developer-mac"
window = { width = 1100, height = 720 }

[[step]]
pause = 600
[[step]]
click = { role = "button", name = "Scan" }
[[step]]
wait = "scan-finished"
[[step]]
pause = 800
[[step]]
click = { role = "checkbox", name = "Select Xcode build data" }
[[step]]
pause = 600
[[step]]
click = { role = "button", name = "Review" }
[[step]]
pause = 1200
[[step]]
click = { role = "button", name = "Move to the Trash" }
[[step]]
pause = 1200
[[step]]
click = { role = "button", name = "Yes, move to the Trash" }
[[step]]
wait = "cleanup-finished"
[[step]]
pause = 2500
