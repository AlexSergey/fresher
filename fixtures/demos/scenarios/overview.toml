# The README's hero: a scan of the developer's Mac. Screens: Scan (the ring, the danger zones and their cards).
# The pointer scans, rests on the largest card of the Safe zone, scrolls the results down and back up. About 5.5 s of
# pauses.
# Every target is traced to its text key in `crates/sandbox/src/scenario/traced.rs` (the test refuses a target no text
# says). A card's Details button has no name of its own (all read "Details"), so no step opens a category.
world = "developer-mac"
window = { width = 1100, height = 720 }

[[step]]
pause = 800
[[step]]
click = { role = "button", name = "Scan" }
[[step]]
wait = "scan-finished"
[[step]]
pause = 1500
[[step]]
hover = { role = "heading", name = "Xcode build data" }
[[step]]
pause = 1200
[[step]]
scroll = { role = "region", name = "Safe to remove", by = 400 }
[[step]]
pause = 1000
[[step]]
scroll = { role = "region", name = "Safe to remove", by = -400 }
[[step]]
pause = 1000
