# The stale-projects module: the dependency and build folders of projects not worked on for a long time, offered from
# the folders under `home` that the walk reads (`home/Code` here). Projects live under `home/Code/<the case's own
# name>/`, so no path is written twice.
#
# EVERY folder of a project is a `[[case.dir]]` with an `age`, the parents of files and `.git/refs/heads` included: a
# folder the generator makes is "changed now", so a stale case that forgets one turns active and fails on its missing
# offer (`home/Code` is written once, by the first positive: a negative owns every folder above its paths, and no
# negative may own the folder holding another case's offer). Ages: 400 days for an old project, 3 days for an active
# one, 10 days for a cache unused for a week.
# Positives' files are small and filled with data.
feature = "stale-projects"
module = "stale-projects"

# Negative cases first, as in every test of the repository.

[[case]]
name = "the source, .git and the project folder are never claimed"
kind = "negative"
[[case.dir]]
path = "home/Code/kept-source"
age = "400d"
changed = "400d"
[[case.dir]]
path = "home/Code/kept-source/.git"
age = "400d"
changed = "400d"
[[case.dir]]
path = "home/Code/kept-source/.git/refs"
age = "400d"
changed = "400d"
[[case.dir]]
path = "home/Code/kept-source/.git/refs/heads"
age = "400d"
changed = "400d"
[[case.dir]]
path = "home/Code/kept-source/src"
age = "400d"
changed = "400d"
[[case.file]]
path = "home/Code/kept-source/package.json"
size = 4096
age = "400d"
changed = "400d"
[[case.file]]
path = "home/Code/kept-source/src/index.ts"
size = 4096
age = "400d"
changed = "400d"
[[case.file]]
path = "home/Code/kept-source/.git/HEAD"
size = 4096
age = "400d"
changed = "400d"
[[case.file]]
path = "home/Code/kept-source/.git/refs/heads/main"
size = 4096
age = "400d"
changed = "400d"
[case.map]
part = "your-folders"
at = "home/Code/kept-source/src"

