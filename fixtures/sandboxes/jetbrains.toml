# The jetbrains module: the settings, caches and logs of older JetBrains IDE versions, and the data of an IDE that is
# no longer installed. Every case lives under `home/Library/{Application Support,Caches,Logs}/JetBrains/` or the apps
# folders. The installed and open apps are the sandbox's own, shared by every case of this file: WebStorm 2025.3.1,
# installed by the first case, is the version the WebStorm positives are older than. An unknown app of the vendor,
# installed or open, keeps every removed IDE's data, so those two cases have files of their own
# (`jetbrains-unknown-app-installed.toml`, `jetbrains-unknown-app-open.toml`).
#
# Folder ages count back from `world.toml`'s `now`. Positives' files are filled with data, so the map's numbers are
# blocks.
feature = "jetbrains"
module = "jetbrains"

# Negative cases first, as in every test of the repository.
[[case]]
name = "the version you use is never offered"
kind = "negative"
[[case.app]]
path = "Applications/WebStorm.app"
bundle-id = "com.jetbrains.WebStorm"
name = "WebStorm"
version = "2025.3.1"
build = "WS-253.28294.334"
[[case.file]]
path = "home/Library/Application Support/JetBrains/WebStorm2025.3/options/editor.xml"
size = 4096
fill = "data"
[[case.file]]
path = "home/Library/Caches/JetBrains/WebStorm2025.3/index/data.bin"
size = 2097152
fill = "data"
[[case.file]]
path = "home/Library/Logs/JetBrains/WebStorm2025.3/idea.log"
size = 8192
fill = "data"
[[case.left-out]]
category = "jetbrains.settings"
reason = "jetbrains.left-out.current"
items = 1
[[case.left-out]]
category = "jetbrains.caches"
reason = "jetbrains.left-out.current"
items = 1
[[case.left-out]]
category = "jetbrains.logs"
reason = "jetbrains.left-out.current"
items = 1
[case.map]
part = "your-folders"
at = "home/Library/Caches/JetBrains/WebStorm2025.3"

[[case]]
name = "two versions installed side by side are both kept"
