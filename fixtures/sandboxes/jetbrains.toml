# An app linked into an apps folder keeps the list of apps whole, so nothing turns `no-system`. The bundle the link
# names is in an apps folder too (a case declares apps only there), so the case cannot show the reader reading through
# the link: `fresher-system`'s unit tests of the installed-apps reader cover that.
[[case]]
name = "an IDE linked into the apps folder keeps the list of apps whole"
kind = "negative"
[[case.app]]
path = "home/Applications/JetBrains/Writerside.app"
bundle-id = "com.jetbrains.writerside"
name = "Writerside"
version = "2025.3"
[[case.symlink]]
path = "Applications/Writerside.app"
target = "../home/Applications/JetBrains/Writerside.app"
[[case.file]]
path = "home/Library/Application Support/JetBrains/Writerside2025.3/options/editor.xml"
size = 4096
[[case.dir]]
path = "home/Library/Application Support/JetBrains/Writerside2025.3"
age = "40d"
[[case.left-out]]
category = "jetbrains.settings"
reason = "jetbrains.left-out.current"
items = 1

