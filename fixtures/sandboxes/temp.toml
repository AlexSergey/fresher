kind = "positive"
[[case.file]]
path = "private/var/folders/xx/sandbox/T/tmp.IKKNWYIRnq"
size = 1048576
age = "30d"
changed = "30d"
fill = "data"
[case.expect]
item = "private/var/folders/xx/sandbox/T/tmp.IKKNWYIRnq"
category = "temp.old-files"
danger = "safe"
after-cleanup = "in-trash"
[case.map]
part = "explained"
at = "private/var/folders/xx/sandbox/T/tmp.IKKNWYIRnq"

