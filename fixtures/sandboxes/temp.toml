# The temp module: the old items apps left in the user's temporary folder (`private/var/folders/xx/sandbox/T/`) and
# in the shared one (`private/tmp/`). Every case lives in those two places, beside them (`C/`, `0/`, `X/`, another
# user's `T`) or in `home/`. What the disk cannot hold is stated (`world.toml`'s `[[entry]]`): an old status change
# (a file written now has a status change of now), an owner or a flag only root can set, a socket or a pipe. The
# open and installed apps are the sandbox's own, shared by every case of this file.
#
# Times count back from `world.toml`'s `now`. Positives' files are filled with data, so the map's numbers are blocks.
feature = "temp"
module = "temp"

# Negative cases first, as in every test of the repository.

[[case]]
name = "a fresh temporary file is kept"
kind = "negative"
[[case.file]]
path = "private/var/folders/xx/sandbox/T/fresh.tmp"
size = 4096
[[case.left-out]]
category = "temp.old-files"
reason = "temp.left-out.recent"
items = 1
[case.map]
part = "your-folders"
at = "private/var/folders/xx/sandbox/T/fresh.tmp"

