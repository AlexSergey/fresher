# The unused-toolchains module with the Node switch off (no `[settings]`): no Node version is offered or left out, a
# toolchain still goes. A world of its own, since the switch is shared by every case of a file.
# No `access` is stated: no case here needs a Documents pin, so the world answers as one that knows nothing about the
# guarded folders and the module runs as in any sandbox.
feature = "unused-toolchains-off"
module = "unused-toolchains"

[[case]]
name = "no Node version is offered while the switch is off"
kind = "negative"
[[case.file]]
path = "home/.nvm/alias/default"
text = "20\n"
[[case.file]]
path = "home/.nvm/versions/node/v20.11.0/bin/node"
size = 4096
fill = "data"
[[case.file]]
path = "home/.nvm/versions/node/v11.15.0/bin/node"
size = 4096
fill = "data"


# Then the positive cases.


[[case]]
name = "a toolchain still goes with the Node switch off"
kind = "positive"
[[case.file]]
path = "home/.rustup/settings.toml"
text = "default_toolchain = \"stable-aarch64-apple-darwin\"\n"
[[case.file]]
path = "home/.rustup/toolchains/stable-aarch64-apple-darwin/bin/rustc"
size = 4096
fill = "data"
[[case.file]]
path = "home/.rustup/toolchains/1.72.0-aarch64-apple-darwin/bin/rustc"
size = 4096
fill = "data"
[case.expect]
item = "home/.rustup/toolchains/1.72.0-aarch64-apple-darwin"
category = "unused-toolchains.rust"
danger = "low"
after-cleanup = "in-trash"
