# The local-ai-models module's Ollama store: its models offered as one finding each, the manifest and the layers no
# other model names going to the Trash together, at Medium. Ollama keeps `manifests/<host>/<namespace>/<model>/<tag>`
# (a manifest is a small JSON file, here its `text`) and `blobs/sha256-<digest>` (layers, here small files with
# `fill = "data"` of the sizes the manifests list). A layer no manifest names, a manifest at another depth and a model
# with a layer of the wrong size (left out `ollama-incomplete`) are never offered. Two tags with the same files are one
# model; a layer another model names stays when its model goes, with the other model's manifest. Models of this file
# are named of their own, apart from the home's folder `.ollama/models` being one store: a left-out of the whole store
# (an unreadable manifest, a download in progress) would hide every model here, so those cases are in files of their
# own, `local-ai-models-ollama-unreadable.toml` and `local-ai-models-ollama-download.toml`. Each of them writes the
# lone layer of this file's first case too, so in `npm run sandbox -- all` this file stays and those two are left out,
# as `EXPECTED.md` names them ([known issue](../../docs/known-issues/repo-sandbox-all-worlds-interact.md)).
feature = "local-ai-models-ollama"
module = "local-ai-models"

# Negative cases first, as in every test of the repository.

[[case]]
name = "a layer no manifest names is never claimed"
kind = "negative"
[[case.file]]
path = "home/.ollama/models/blobs/sha256-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
size = 4096
fill = "data"
age = "40d"
changed = "40d"

