# The app-leftovers module: the files a removed app left in `home/Library`, offered only by bundle id, only for an id
# proven an app's (a saved state of its windows), and only when every check says the app is gone: not installed (by id
# or a helper's), not open, not changed in the last 30 days, and not found by Spotlight. The module reads no app
# container: a container neither proves an id nor is offered, since an installed app's extension keeps a container
# under its own id. `Library/Containers` is not opened in sandbox mode either (it may prompt, as
# `Library/Group Containers` may). Spotlight answers the sandbox's listed apps and the apps a case declares elsewhere
# (`[[case.elsewhere]]`); `app-leftovers-spotlight-off.toml` turns it off, a world of its own, since Spotlight off
# would keep every id of this file.
#
# Every entry of a leftover states its age and status change (40 days, or 5 for a recent one): a status change cannot
# be set back on disk, and a whole folder's age is the newest inside it, so a folder holds its files directly.
# Positives' files are filled with data, so the map's numbers are blocks.
feature = "app-leftovers"
module = "app-leftovers"

# Negative cases first, as in every test of the repository.

[[case]]
name = "a name that is not an app's id is never claimed"
kind = "negative"
[[case.dir]]
path = "home/Library/Application Support/Notes"
age = "40d"
changed = "40d"
[[case.file]]
path = "home/Library/Application Support/Notes/notes.db"
size = 4096
age = "40d"
changed = "40d"
[[case.dir]]
path = "home/Library/Caches/SomeTool"
age = "40d"
changed = "40d"
[[case.file]]
path = "home/Library/Caches/SomeTool/x"
size = 4096
age = "40d"
changed = "40d"
[[case.file]]
path = "home/Library/Preferences/settings.plist"
size = 4096
age = "40d"
changed = "40d"
[case.map]
part = "your-folders"
at = "home/Library/Application Support/Notes"

