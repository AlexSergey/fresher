# The Trash line with an empty Trash: nothing is said before the cleanup; after it, everything in the Trash is from
# cleanups here.
feature = "trash-empty"
module = "trial"

# Negative cases first, as in every test of the repository.
[[case]]
name = "a plain file next to a marker is never offered"
kind = "negative"
[[case.marker]]
path = "home/trash-empty-plain"
[[case.file]]
path = "home/trash-empty-plain/keep.txt"
size = 512

[[case]]
name = "a trial cache goes to the Trash and is all the Trash holds"
kind = "positive"
[[case.marker]]
path = "home/trash-empty-work"
[[case.file]]
path = "home/trash-empty-work/Sample app cache/blob.bin"
size = 1048576
fill = "data"
[case.expect]
item = "home/trash-empty-work/Sample app cache"
category = "trial.caches"
danger = "safe"
after-cleanup = "in-trash"
