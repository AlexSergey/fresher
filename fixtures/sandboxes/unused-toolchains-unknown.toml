# The unused-toolchains module in a world where it cannot tell what is used: no rustup `settings.toml` (the default is
# unknown) and an nvm pin nothing resolves. Files of their own, since rustup's settings file is one for the whole file.
# No `access` is stated: no case here needs a Documents pin, so the world answers as one that knows nothing about the
# guarded folders and the module runs as in any sandbox.
feature = "unused-toolchains-unknown"
module = "unused-toolchains"

[settings]
"unused-toolchains.node-versions" = true

[[case]]
name = "without rustup's settings no toolchain is offered"
kind = "negative"
[[case.file]]
path = "home/.rustup/toolchains/1.71.0-aarch64-apple-darwin/bin/rustc"
size = 4096
fill = "data"
[[case.left-out]]
category = "unused-toolchains.rust"
reason = "unused-toolchains.left-out.default-unknown"
items = 1


[[case]]
name = "an nvm pin that cannot be resolved keeps every Node version"
kind = "negative"
[[case.file]]
path = "home/Code/odd/.nvmrc"
text = "lts/unknown\n"
[[case.file]]
path = "home/.nvm/alias/default"
text = "20\n"
[[case.file]]
path = "home/.nvm/versions/node/v20.11.0/bin/node"
size = 4096
fill = "data"
[[case.file]]
path = "home/.nvm/versions/node/v13.14.0/bin/node"
size = 4096
fill = "data"
[[case.left-out]]
category = "unused-toolchains.node"
reason = "unused-toolchains.left-out.pin-unknown"
items = 1
