# The temporary places of the temp module's core end-to-end flows (crates/e2e/tests/temp.rs), laid out as a sandbox
# lays them out beside its home: the user's own temporary folder `private/var/folders/xx/sandbox/T` and the shared one
# `private/tmp`; the flows add the rest of the sandbox's layout and its marker. Three old items are offered: a file
# (30 days), a folder (20 days) and a file of the shared folder (10 days), filled with data so a put back is compared
# byte for byte. A fresh file (1 day) is kept as recent and an old package the system owns (stated) as the system's.
# Times count back from `FIXTURE_NOW`; the status changes are stated, as a file written now has a status change of now.

