# A home for the downloads module where nothing is the module's to claim, and nothing is kept either: a document, names
# that are not an installer of an installed app, a link, a folder of the user's, an app run from Downloads, a bundle
# that is not Safari's, and files just under the size of a big one. The 400-day files are old enough that only the
# rule, not the age, decides. The module's system for this home: Firefox 133.0 installed and changed 10 days ago,
# Apple's Notes installed, macOS 15.4.

