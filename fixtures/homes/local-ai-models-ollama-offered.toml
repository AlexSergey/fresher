# A home whose Ollama store offers its models. `llama3:latest` and `llama3:8b` name the same files (one finding, both
# tags); `mistral:7b` shares nothing; `qwen:base` and `me/qwen-chat:latest`, made from it, share two layers (each
# frees its own files, and its reason names the other); `me/qwen-tools:latest` shares one layer with `me/qwen-chat`,
# whose reason then names `qwen:base` and one more model; `hf.co/org/tiny-gguf:q4` is on another host (its title names
# it). `broken:1` lists a layer of 2000 bytes whose file has 1999: it is left out `ollama-incomplete`; it also names
# one of llama3's layers, which still counts as named, so llama3 does not free it and its reason names `broken:1`.
# Manifests are their JSON text, layers filled with data of the sizes the manifests list; the freed layers were opened
# 30 days ago.

