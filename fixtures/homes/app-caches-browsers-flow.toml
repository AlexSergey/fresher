# The home of the app-caches module's browser and web-engine core end-to-end flows
# (crates/e2e/tests/app_caches_browsers.rs), laid out as a sandbox lays out its home (`home/`); the flows add the rest
# of the sandbox's layout and its marker.
# Google Chrome keeps the caches of two profiles under `Library/Caches/Google/Chrome` (`Default`'s `Cache` and
# `Code Cache`, `Profile 1`'s `Cache`) beside `Default`'s `image_cache`, which is not a table cache, and its profile
# data in its support folder (history, cookies, passwords, preferences), never touched. Redis Insight keeps `Cache`
# and `GPUCache` in its support folder beside its cookies and local storage.
# The other modules' answers beside them: the removed `com.example.Gone`, unchanged for 40 days, has a cache and a
# saved state (`app-leftovers`'), Yarn's cache (`dev-caches`'), an older JetBrains IDE (WebStorm 2024.3, 2025.3 in
# use, `jetbrains`') and the installed `com.example.Editor`'s id-named cache (`app-caches.library-caches`).

