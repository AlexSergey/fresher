# The home of the stale-projects module's negative fixture run: nothing in it is offered or left out. A stale Node
# project without `node_modules` but with source, `dist`, `.next`, `.turbo` and `.git`; a `node_modules` with no project
# marker; a project whose `node_modules` is a link; a project at the home itself; projects in a hidden folder, in
# `Library` and in an app bundle; a Go project with a `target`; a Node project's `build`; a stale Gradle project whose
# `build` is itself a Node project (a project folder is never offered as another's artifact). EVERY folder is a dated
# `[[dir]]` (400 days): an undated folder counts as changed now and turns a stale case active.

