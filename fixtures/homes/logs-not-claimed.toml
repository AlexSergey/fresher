size = 4096
age = "30d"
changed = "30d"

[[file]]
path = "Documents/kept.log"
size = 2048
age = "30d"
changed = "30d"

[[symlink]]
path = "Library/Logs/linked.log"
target = "../../Documents/kept.log"
age = "30d"
changed = "30d"

