# A home for the logs module in which nothing is offered and nothing is left out, because none of it is the module's
# to claim: a removed app's folder and a bundle-id-named folder (other modules' places), JetBrains' folder, a link, an
# empty folder, state and lock names, a file seven names deep (beyond the module's reach), and folders named alike
# outside `Library/Logs`. Every item is 30 days old; the status changes are stated.

[[file]]
path = "Library/Logs/com.example.Gone/app.log"
size = 4096
age = "30d"
changed = "30d"

[[file]]
path = "Library/Logs/com.apple.Safari/x.log"
size = 4096
age = "30d"
changed = "30d"

[[file]]
