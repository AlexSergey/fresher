# A home for the app-leftovers module whose ids have no proof of an app: a tool's caches, logs, settings and support
# folder with no saved state and no container; an id whose saved state is a file, not a folder; and version-like names
# (an IDE's or a language's folders), shaped as ids, with no proof either. Every entry unchanged for 40 days.

[[dir]]
path = "Library/Caches/org.example.tool"
age = "40d"
changed = "40d"

[[file]]
path = "Library/Caches/org.example.tool/x"
size = 4096
age = "40d"
changed = "40d"

[[dir]]
path = "Library/Logs/org.example.tool"
age = "40d"
changed = "40d"

[[file]]
path = "Library/Logs/org.example.tool/tool.log"
size = 4096
age = "40d"
changed = "40d"

[[file]]
