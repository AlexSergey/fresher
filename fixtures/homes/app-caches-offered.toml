# A home for the app-caches module where every folder is offered, in the name of the app that owns it:
# `com.example.Editor` (the app's own), `com.example.Editor.Helper` (a helper's), `com.example.Editor.ShipIt` (an id
# under the app's); `com.example.Suite` and `com.example.Suite.Pro` are two installed apps, each the owner of its own.

