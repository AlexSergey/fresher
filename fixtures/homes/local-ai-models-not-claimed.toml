# A home for the local-ai-models module where nothing is a model of a store, so nothing is offered and nothing is
# left out: a space (a kind the row does not list), locks and a version file beside the models, a repository without
# `blobs` and `snapshots`, a name of four parts, a link to a folder outside the hub; in LM Studio's folder a file at a
# model's depth and a hidden publisher; Ollama's folder with `blobs/` but no `manifests/` (not its store's layout);
# and a model file in a project. Every file has a time, so only the rule under test can keep a folder out. Ollama's
# other cases are `local-ai-models-ollama-not-claimed.toml`'s.

