# The home of the stale-projects module's kept fixture run: each project is kept, with its reason. `active` changed 3
# days ago (`recent`); `committed` has 400-day folders and a branch moved 3 days ago (`recent`); `mono` is a monorepo
# whose nested package changed 3 days ago, so both packages' `node_modules` are `recent`; `engine` is an active Rust
# project whose `target` is `recent` and whose incremental cache was built 3 days ago (`cache-recent`); `hidden-part`
# has a folder the walk is told to avoid (`private`), so its last change is unknown (`unread`); `pip-old` is a 400-day
# Python project whose `.venv` had a package installed 3 days ago, so the `.venv` itself is `recent`. EVERY folder is
# a dated `[[dir]]`, parents of files and `.git/refs/heads` included: an undated folder counts as changed now.

