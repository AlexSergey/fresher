# A home for the app-leftovers module holding Apple's own apps' files in every place, each with a saved state, all
# unchanged for 40 days: `com.apple.` is never claimed.

[[dir]]
path = "Library/Caches/com.apple.Safari"
age = "40d"
changed = "40d"

