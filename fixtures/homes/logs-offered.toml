# A home for the logs module with old files that are all offered, and one that is kept: a top-level log, a
# top-level file named as a bundle id (only a folder of that shape is another module's), logs in a folder and four
# folders deep, a log five folders deep (six names), a log 10 days old (offered at the default 7 days, kept at 14),
# and crash reports in `DiagnosticReports` and in a folder below it. The fresh log beside the old ones is kept as
# recent. Times count back from `FIXTURE_NOW`; the status changes are stated.

