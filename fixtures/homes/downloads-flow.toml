# The home of the downloads module's core end-to-end flows (crates/e2e/tests/downloads.rs), laid out as a sandbox
# lays out its home (`home/`); the flows add the rest of the sandbox's layout and its marker. `Downloads` holds one
# item per category and per reason to keep: Chrome's `movie.mp4.crdownload` (40 days) and Opera's `Draft.iso.opdownload`
# (20 days, within the setting's 30); Firefox's `video.mkv.part` with its empty placeholder; Safari's resumable
# `trip.zip.download`; the installers of Firefox (installed since), of `Example` (newer than the Example installed
# first, so kept until it is updated) and of the package `Tool-3.1.pkg` (a receipt proves it); a macOS installer; a
# 2 GB file untouched for 400 days. `Project` is the user's own folder with a `node_modules` inside: it is no
# download, and the walk still opens it. `Documents/keep.txt` is outside Downloads. Every entry of Downloads states
# its age and status change.

