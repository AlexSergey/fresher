# A home for the unused-toolchains module that cannot tell what is used: no rustup settings.toml (the default is unknown,
# so every toolchain is kept) and a .nvmrc naming an LTS alias nothing defines (a pin it cannot read, so every Node
# version but the newest is kept). Every folder is a dated `[[dir]]`.

