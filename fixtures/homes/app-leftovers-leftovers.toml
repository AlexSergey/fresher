# A home for the app-leftovers module whose leftovers are all offered: `com.example.Gone` in the ten forms of
# `places.toml`, `com.example.Appx` (caches and a saved state) beside the installed `com.example.App`, and
# `com.example.Boxed` with only a container and its caches. Every entry unchanged for 40 days, every file filled with
# data.

[[dir]]
path = "Library/Caches/com.example.Gone"
age = "40d"
changed = "40d"

[[file]]
path = "Library/Caches/com.example.Gone/Cache.db"
size = 4096
age = "40d"
changed = "40d"
fill = "data"

