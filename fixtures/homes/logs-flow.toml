# The home of the logs module's core end-to-end flows (crates/e2e/tests/logs.rs), laid out as a sandbox lays out its
# home (`home/`); the flows add the rest of the sandbox's layout and its marker.
# Under `Library/Logs`: an app's folder with an old rotated log and the fresh log beside it (one day), a vendor's
# nested folder with an old log and an old state file (no one's), a top-level log ten days old and an old crash
# report; old entries are unchanged for 30 days. Beside them, the removed `com.example.Gone`'s leftovers (its logs,
# caches and saved state, unchanged for 40 days, not installed: `app-leftovers` offers them) and an older JetBrains
# IDE's logs (WebStorm 2024.3, 2025.3 installed: `jetbrains` offers the folder). Every file holds data, so a put back
# is compared byte for byte.

[[file]]
path = "home/Library/Logs/Writer/writer.1.log"
size = 65536
age = "30d"
changed = "30d"
fill = "data"

