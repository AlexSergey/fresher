[workspace]
resolver = "3"
members = ["app/tauri", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# Fast scans in debug builds: dependencies are optimized, the workspace's own code is not.
[profile.dev.package."*"]
opt-level = 2
