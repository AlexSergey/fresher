[package]
name = "fresher-app"
description = "The Tauri 2 shell of Fresher: thin commands over the core crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
fresher-cleaner = { path = "../../crates/cleaner" }
fresher-core = { path = "../../crates/core" }
fresher-engine = { path = "../../crates/engine" }
fresher-macos = { path = "../../crates/macos" }
fresher-module-jetbrains = { path = "../../modules/jetbrains" }
fresher-module-temp = { path = "../../modules/temp" }
fresher-module-dev-caches = { path = "../../modules/dev-caches" }
fresher-module-app-leftovers = { path = "../../modules/app-leftovers" }
fresher-module-app-caches = { path = "../../modules/app-caches" }
fresher-module-logs = { path = "../../modules/logs" }
fresher-module-downloads = { path = "../../modules/downloads" }
fresher-module-stale-projects = { path = "../../modules/stale-projects" }
fresher-module-local-ai-models = { path = "../../modules/local-ai-models" }
fresher-module-unused-toolchains = { path = "../../modules/unused-toolchains" }
fresher-module-xcode = { path = "../../modules/xcode" }
fresher-module-docker = { path = "../../modules/docker" }
# Registered in debug builds only (`src/compose.rs`); Cargo cannot make a dependency depend on `debug_assertions`.
fresher-module-demo = { path = "../../modules/demo" }
fresher-module-trial = { path = "../../modules/trial" }
# Sandbox mode (`src/sandbox.rs`), used in debug builds only, as the dev-only modules above.
fresher-sandbox = { path = "../../crates/sandbox" }
fresher-scanner = { path = "../../crates/scanner" }
fresher-store = { path = "../../crates/store" }
fresher-system = { path = "../../crates/system" }
# Sandbox mode, debug builds only: its Trash (`FakeTrash`) and its stated facts (`FactsLens`, `StatedFacts`);
# the shell's tests' fakes.
fresher-testing = { path = "../../crates/testing" }
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
# The next three serve the development run record (`src/dev_runs/`), debug builds only.
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
ts-rs.workspace = true
