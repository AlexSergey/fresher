# The JetBrains IDEs whose older versions' folders the module recognizes (plan 016, design section 2).
# `folder`: what each version's folder name starts with (`WebStorm2025.3`), plain letters, compared exactly.
# `name`: the product as the app shows it. `bundle-ids`: the release's and the early access build's.
# `other-apps`: the vendor's apps that are not IDEs and keep no version folders; one of them running keeps nothing.
# A running app whose bundle id starts `com.jetbrains.` and is listed nowhere here keeps every product's folders.
# Every bundle id is checked by hand with `mdls` on a real Mac in 016/04/02.

other-apps = ["com.jetbrains.toolbox"]

[[product]]
folder = "IntelliJIdea"
name = "IntelliJ IDEA"
bundle-ids = ["com.jetbrains.intellij", "com.jetbrains.intellij-EAP"]

[[product]]
folder = "IdeaIC"
name = "IntelliJ IDEA Community Edition"
bundle-ids = ["com.jetbrains.intellij.ce", "com.jetbrains.intellij.ce-EAP"]

