# The trial module's rules: folders that only a developer makes, claimed only right next to the sandbox marker.

[[rule]]
id = "cache"
category = "trial.caches"
danger = "safe"
removal = "trash"
[rule.look]
folder-name = "Sample app cache"
[rule.recognize]
sibling = ".fresher-sandbox"
# `Sample app cache2`, `Sample app cache.txt`: they only resemble it.
[[rule.must-not-match]]
name = "Sample app cache?*"

[[rule]]
id = "kept"
category = "trial.kept"
danger = "low"
removal = "empty-folder"
[rule.look]
folder-name = "Old sample downloads"
[rule.recognize]
sibling = ".fresher-sandbox"
# `Old sample downloads2`, `Old sample downloads.txt`: they only resemble it.
[[rule.must-not-match]]
name = "Old sample downloads?*"
